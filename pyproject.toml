[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medstock"
version = "0.1.0"
description = "Medicine stock and expiry tracker for small pharmacies and clinics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nistha Agarwal" }]
dependencies = []

[project.scripts]
medstock = "medstock.cli:main"

[tool.setuptools]
packages = ["medstock"]
