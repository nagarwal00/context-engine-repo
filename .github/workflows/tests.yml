name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke test with sample data
        run: |
          python -m medstock.cli --db ci.db --today 2026-11-21 import-csv data/sample_inventory.csv
          python -m medstock.cli --db ci.db --today 2026-11-21 alerts
